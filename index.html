<!DOCTYPE html>
<html>
<head>
	<title>E-Commerce website Using Bootstrap</title>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<!-- Themify Icons -->
	<link rel="stylesheet" href="css/themify-icons.css">

	<!-- Bootstrap css -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

	<!-- Style css -->
	<link rel="stylesheet" href="css/style.css">

	<!-- Responsive css -->
	<link rel="stylesheet" href="css/responsive.css">

</head>
<body data-bs-spy="scroll" data-bs-target=".navbar">

	<!-- Navigation section -->
	<section id="header">
		<nav class="navbar navbar-expand-lg fixed-top">
		  	<div class="container">
			    <a class="navbar-brand" href="#">
    				<img src="images/logo.png"
         				class="img-fluid logo"
         				alt="PopVana Fashion Store Logo">
				</a>

			    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
			    	<span class="navbar-toggler-icon"></span>
			    </button>
			    <div class="collapse navbar-collapse" id="navbarNav">
			      	<ul class="navbar-nav ms-auto">
			        	<li class="nav-item">
			          		<a class="nav-link active" aria-current="page" href="#home">Home</a>
			        	</li>
			        	<li class="nav-item">
			          		<a class="nav-link" href="#products">Products</a>
			        	</li>
				        <li class="nav-item">
		  		          	<a class="nav-link" href="#special">Special</a>
				        </li>
				        <li class="nav-item">
		  		          	<a class="nav-link" href="#testimonial">Testimonials</a>
				        </li>
				        <li class="nav-item">
		  		          	<a class="nav-link" href="#contact">Contact</a>
				        </li>			    	   
			      	</ul>
			    </div>
			</div>
		</nav>
		
	</section>


	<!-- Home section -->
	<section id="home" class="home">
		<div id="carouselExampleIndicators" class="carousel slide">
			<div class="carousel-indicators">
		    	<button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
		    	<button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
		  	</div>
		  	<div class="carousel-inner gap-4">
		    	<div class="carousel-item active">
		      		<div class="home-banner home-banner-1">
		      			<div class="home-banner-text">
		      				<h1>Women</h1>
		      				<h2>45% Discount For This Season</h2>		      		
		      				<a href="#" class="btn btn-danger text-uppercase mt-4">Our Products</a>
		      			</div>
		      		</div>
		    	</div>
			    <div class="carousel-item">
			      	<div class="home-banner home-banner-2">
		      			<div class="home-banner-text">
		      				<h1>E-Shop</h1>
		      				<h2>With Working Card & Pay Pal</h2>
		      				<a href="#" class="btn btn-danger text-uppercase mt-4">Our Products</a>
		      			</div>
		      		</div>
			    </div>
			  	</div>
			  	<button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
			    	<span class="carousel-control-prev-icon" aria-hidden="true">
			    		<span class="ti-angle-left slider-icon"></span>
			    	</span>
			    	<span class="visually-hidden">Previous</span>
			  	</button>
			  	<button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
			    	<span class="carousel-control-next-icon" aria-hidden="true">
			    		<span class="ti-angle-right slider-icon"></span>
			    	</span>
			    	<span class="visually-hidden">Next</span>
			  	</button>
			</div>
		</div>
		
			<!-- Offer section -->
		<div class="offers">
			<div class="container">
				<div class="row">
					<!-- Offer Box One -->
					<div class="col-sm-6 col-lg-4 mb-lg-0 mb-4">
						<a href="#">
							<div class="offer-box text-center position-relative">
								<div class="offer-inner">
									<div class="offer-image position-relative overflow-hidden">
										<img src="images/offer_1.png" alt="offers" class="img-fluid">
										<div class="offer-overlay"></div>
									</div>
									<div class="offer-info">
										<div class="offer-info-inner">
											<p class="heading-bigger text-capitalize">Sale 25%</p>
											<p class="offer-title-1 text-uppercase font-weight-bold">Don't Miss This Chance</p>
											<button type="button" class="btn btn-outline-danger text">Shop Now</button>
										</div>
									</div>
								</div>
							</div>
						</a>
					</div>

					<!-- Offer Box two -->
					<div class="col-sm-6 col-lg-4 mb-lg-0 mb-4 d-flex flex-column justify-content-between">
						<a href="#">
							<div class="offer-box text-center position-relative mb-4 mb-sm-0 mb-lg-0">
								<div class="offer-inner">
									<div class="offer-image position-relative overflow-hidden">
										<img src="images/offer2.png" alt="offers" class="img-fluid">
										<div class="offer-overlay"></div>
									</div>
									<div class="offer-info">
										<div class="offer-info-inner">
											<p class="heading-bigger text-capitalize">Sale 55%</p>
											<p class="offer-title-1 text-uppercase font-weight-bold">Don't Miss This Chance</p>
											<button type="button" class="btn btn-outline-danger text">Shop Now</button>
										</div>
									</div>
								</div>
							</div>
						</a>
						<a href="#">
							<div class="offer-box text-center position-relative">
								<div class="offer-inner">
									<div class="offer-image position-relative overflow-hidden">
										<img src="images/offer3.png" alt="offers" class="img-fluid">
										<div class="offer-overlay"></div>
									</div>
									<div class="offer-info">
										<div class="offer-info-inner">
											<p class="heading-bigger text-capitalize">Sale 40%</p>
											<p class="offer-title-1 text-uppercase font-weight-bold">Don't Miss This Chance</p>
											<button type="button" class="btn btn-outline-danger text">Shop Now</button>
										</div>
									</div>
								</div>
							</div>
						</a>
					</div> 

					<!-- Offer Box Three -->
					<div class="col-sm-6 col-lg-4 mb-lg-0 mb-4">
						<a href="#">
							<div class="offer-box text-center position-relative">
								<div class="offer-inner">
									<div class="offer-image position-relative overflow-hidden">
										<img src="images/offer4.png" alt="offers" class="img-fluid">
										<div class="offer-overlay"></div>
									</div>
									<div class="offer-info">
										<div class="offer-info-inner">
											<p class="heading-bigger text-capitalize">Sale 35%</p>
											<p class="offer-title-1 text-uppercase font-weight-bold">Don't Miss This Chance</p>
											<button type="button" class="btn btn-outline-danger text">Shop Now</button>
										</div>
									</div>
								</div>
							</div>
						</a>
					</div>
				</div>
			</div>
		</div>
	</section>

	<!-- Bootstrap js -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

	<!-- Main js -->
	<script src="js/main.js"></script>
</body>

</html>
